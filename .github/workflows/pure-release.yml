name: Pure Release

on:
  workflow_run:
    workflows:
      - Sync Upstream
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: pure-release
  cancel-in-progress: false

env:
  RELEASE_TAG_PREFIX: pure-build
  WXT_ANALYTICS_DAILY_FEATURE_CACHE_ENABLED: "true"
  WXT_SKIP_ENV_VALIDATION: true

jobs:
  release:
    name: Build and publish pure release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: 0

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pure extension ZIP packages
        run: pnpm zip:pure:all

      - name: Record release revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Generate unique release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r '.version' package.json)"
          tag="${RELEASE_TAG_PREFIX}-v${version}-${GITHUB_RUN_ID}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Delete previous pure releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tags="$(git ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG_PREFIX}*" | awk '{print $2}' | sed 's#refs/tags/##')"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue

            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --cleanup-tag \
                --yes
            else
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            fi
          done <<< "${tags}"

      - name: Create release and upload ZIP packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Pure Build v${{ steps.release.outputs.version }}
          target_commitish: ${{ steps.revision.outputs.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: .output/*.zip
