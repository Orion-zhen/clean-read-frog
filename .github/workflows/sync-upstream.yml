name: Sync Upstream

on:
  schedule:
    # Every Monday at 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: mengxi-ream/read-frog
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  SYNC_BRANCH: automation/sync-upstream

jobs:
  prepare:
    name: Create upstream sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_updates: ${{ steps.sync.outputs.has_updates }}
      base_sha: ${{ steps.sync.outputs.base_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      pr_number: ${{ steps.sync.outputs.pr_number }}
    steps:
      - name: Checkout downstream branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Push upstream branch and create PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          base_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"

          if git merge-base --is-ancestor "${upstream_sha}" "${base_sha}"; then
            echo "has_updates=false" >> "${GITHUB_OUTPUT}"
            echo "Downstream is already up to date with upstream."
            exit 0
          fi

          echo "has_updates=true" >> "${GITHUB_OUTPUT}"

          # Point the PR branch directly at upstream/main. GitHub's merge commit will
          # preserve both the downstream customizations and upstream ancestry.
          git push origin "${upstream_sha}:refs/heads/${SYNC_BRANCH}"

          pr_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          cat > "${RUNNER_TEMP}/upstream-sync-pr.md" <<EOF
          Automated weekly synchronization from \`${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}\`.

          - Downstream base: \`${base_sha}\`
          - Upstream revision: \`${upstream_sha}\`

          The merged tree is validated by this workflow before the PR is merged automatically.
          If merging or validation fails, this PR remains open for diagnosis.
          EOF

          if [[ -z "${pr_number}" ]]; then
            pr_url="$(
              gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base "${TARGET_BRANCH}" \
                --head "${SYNC_BRANCH}" \
                --title "chore(sync): merge upstream main" \
                --body-file "${RUNNER_TEMP}/upstream-sync-pr.md"
            )"
            pr_number="$(gh pr view "${pr_url}" --repo "${GITHUB_REPOSITORY}" --json number --jq '.number')"
          else
            gh pr edit "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore(sync): merge upstream main" \
              --body-file "${RUNNER_TEMP}/upstream-sync-pr.md"
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "Created or updated PR #${pr_number}."

  validate:
    name: Validate merged tree
    needs: prepare
    if: needs.prepare.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUSKY: 0
      SKIP_FREE_API: true
      WXT_SKIP_ENV_VALIDATION: true
    steps:
      - name: Checkout exact downstream base
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge exact upstream revision
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git cat-file -e "${UPSTREAM_SHA}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "${UPSTREAM_SHA}"

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec nx fmt:check

      - name: Lint and type check
        run: pnpm lint

      - name: Build official distribution
        run: pnpm build

      - name: Build and audit pure distribution
        run: pnpm build:pure

      - name: Run tests
        run: pnpm test

      - name: Run pure distribution tests
        run: pnpm test:pure

  merge:
    name: Merge upstream sync PR
    needs:
      - prepare
      - validate
    if: needs.prepare.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify revisions and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          current_base="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha'
          )"
          if [[ "${current_base}" != "${BASE_SHA}" ]]; then
            echo "Target branch changed during validation; rerun the workflow against the new base."
            exit 1
          fi

          current_head="$(
            gh pr view "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json headRefOid \
              --jq '.headRefOid'
          )"
          if [[ "${current_head}" != "${UPSTREAM_SHA}" ]]; then
            echo "Sync PR head changed during validation; refusing to merge an unvalidated revision."
            exit 1
          fi

          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --merge \
            --delete-branch \
            --match-head-commit "${UPSTREAM_SHA}"
